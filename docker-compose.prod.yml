services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sitewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sitewatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitewatch -d sitewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://sitewatch:${POSTGRES_PASSWORD}@postgres:5432/sitewatch
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-https://sitewatch.ai4bzr.com}
      CHECK_RETENTION_DAYS: ${CHECK_RETENTION_DAYS:-2}
      FAILED_EMAIL_RETENTION_DAYS: ${FAILED_EMAIL_RETENTION_DAYS:-3}
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_URL:-https://sitewatch.ai4bzr.com}
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_URL:-https://sitewatch.ai4bzr.com}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  postgres_data:
